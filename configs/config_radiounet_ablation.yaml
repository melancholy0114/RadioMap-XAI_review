# RadioUNet_C Physics-L1 warm-start stage (20 epochs)

data:
  root_dir: "./data"
  gain_method: "DPM"
  img_size: 256
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42              # must match the corresponding L1 run
  num_workers: 4
  pin_memory: true

model:
  name: "radiounet_c"
  inp_channels: 2
  out_channels: 1

training:
  batch_size: 8
  epochs: 20
  full_resume: false          # warm-start RadioUNet-L1 with a fresh optimizer
  lr: 0.0002
  weight_decay: 0.0001
  scheduler: "CosineAnnealingLR"
  T_max: 50
  eta_min: 0.0000001
  grad_clip: 0.01
  grad_accum_steps: 4
  amp_init_scale: 1.0
  log_interval: 50
  seed: 42
  resume: null

loss:
  primary: "physics_weighted_l1"
  physics_alpha: 0.3

output:
  checkpoint_dir: "./outputs/radiounet_c/l1/checkpoints"
  log_dir: "./outputs/radiounet_c/l1/logs"
  physics_checkpoint_dir: "./outputs/radiounet_c/physics_l1/checkpoints"
  physics_log_dir: "./outputs/radiounet_c/physics_l1/logs"
  prediction_dir: "./outputs/radiounet_c/physics_l1/predictions"
  explanation_dir: "./outputs/radiounet_c/physics_l1/explanations"
  figure_dir: "./outputs/radiounet_c/figures"

explainability:
  methods:
    - "integrated_gradients"
    - "grad_cam"
    - "occlusion_sensitivity"
  num_samples: 50
  ig_steps: 50
  occlusion_stride: 8
  occlusion_window: 16

priors:
  los_bandwidth: 3
  directional_sectors: 8

metrics:
  faithfulness_top_k: [1, 5, 10, 20, 30]
  stability_noise_std: 0.01
  stability_num_samples: 10
